services:
  open-seo:
    image: ghcr.io/every-app/open-seo:latest
    restart: unless-stopped
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    #
    # No variable interpolation anywhere in this file: Temps runs an extra
    # `docker compose config` resolution pass for any file that interpolates,
    # and that pass fails on this host. Bare `- NAME` entries pass the value
    # through from the project environment instead.
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=3001
      - ALLOWED_HOST
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED
      - DO_NOT_TRACK
      - DATAFORSEO_API_KEY
      # Optional: AI features (the SAM agent). Without this the setup
      # gate in the app asks for the key, but nothing here would forward it.
      - OPENROUTER_API_KEY
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - BETTER_AUTH_SECRET
      - OPENROUTER_MODEL
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:13001:3001"
    volumes:
      - open_seo_data:/app/.wrangler
volumes:
  open_seo_data:
